<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar Sesión - JettraStudio Pro</title>
</head>
<body style="min-height:100vh; margin:0; display:flex; align-items:center; justify-content:center; background:var(--jf-bg, #0b0f19); font-family:system-ui, -apple-system, sans-serif; color:var(--jf-text, #f8fafc);">

    <div style="position:fixed; top:16px; right:16px; display:flex; gap:12px; align-items:center;">
        <jettras:theme-selector/>
    </div>

    <div class="login-card" style="width:100%; max-width:420px; background:var(--jf-surface, #1e293b); border:1px solid var(--jf-border, rgba(255,255,255,0.1)); border-radius:16px; padding:40px 32px; box-shadow:0 20px 40px rgba(0,0,0,0.5); box-sizing:border-box;">
        
        <!-- Logo e Icono Header -->
        <div style="text-align:center; margin-bottom:28px;">
            <div style="display:inline-flex; align-items:center; justify-content:center; width:64px; height:64px; background:rgba(255,215,0,0.12); border:1px solid var(--jf-accent, #ffd700); border-radius:16px; font-size:2rem; margin-bottom:12px;">
                🎨
            </div>
            <h1 jettras:id="loginTitle" style="font-size:1.6rem; font-weight:800; margin:0 0 6px 0; color:var(--jf-text, #ffffff);">
                JettraStudio Admin
            </h1>
            <p jettras:id="loginSubtitle" style="font-size:0.9rem; color:var(--jf-text-secondary, #94a3b8); margin:0;">
                Acceso al Sistema
            </p>
        </div>

        <!-- Banner de Error si aplica -->
        <div jettras:id="errorAlert" style="margin-bottom:20px;"></div>

        <!-- Modal de Error si aplica -->
        <div jettras:id="errorModal"></div>

        <!-- Formulario de Acceso -->
        <form jettras:id="loginForm" style="display:flex; flex-direction:column; gap:18px;">
            <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:0.85rem; font-weight:600; color:var(--jf-text, #ffffff);">Nombre de Usuario:</label>
                <input jettras:id="username" type="text" style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--jf-border, #475569); background:rgba(0,0,0,0.25); color:var(--jf-text, #ffffff); box-sizing:border-box; font-size:0.95rem;" />
            </div>

            <div style="display:flex; flex-direction:column; gap:6px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="font-size:0.85rem; font-weight:600; color:var(--jf-text, #ffffff);">Contraseña:</label>
                    <a jettras:id="linkForgot" href="#" style="font-size:0.8rem; color:var(--jf-accent, #ffd700); text-decoration:none;">¿Olvidó su contraseña?</a>
                </div>
                <input jettras:id="password" type="password" style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--jf-border, #475569); background:rgba(0,0,0,0.25); color:var(--jf-text, #ffffff); box-sizing:border-box; font-size:0.95rem;" />
            </div>

            <div style="margin-top:8px;">
                <button jettras:id="btnLogin" type="submit" style="width:100%; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; border-radius:8px;">
                    Iniciar Sesión
                </button>
            </div>
        </form>

        <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--jf-border, rgba(255,255,255,0.08)); text-align:center; font-size:0.85rem; color:var(--jf-text-secondary, #94a3b8);">
            Credenciales Demo: <strong>admin</strong> / <strong>admin123</strong>
        </div>
    </div>

</body>
</html>
