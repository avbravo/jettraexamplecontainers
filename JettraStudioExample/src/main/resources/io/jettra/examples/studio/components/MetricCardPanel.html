<div class="metric-card" style="background:var(--jf-surface, #1e293b); border:1px solid var(--jf-border, rgba(255,255,255,0.1)); border-radius:12px; padding:20px; box-shadow:0 8px 24px rgba(0,0,0,0.3); display:flex; flex-direction:column; gap:8px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span jettras:id="metricTitle" style="font-size:0.9rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--jf-text-secondary, #94a3b8);">Título</span>
        <span jettras:id="metricIcon" style="font-size:1.4rem;">📊</span>
    </div>
    <div jettras:id="metricValue" style="font-size:1.9rem; font-weight:800; color:var(--jf-accent, #38bdf8);">0</div>
    <div style="font-size:0.85rem; color:var(--jf-success, #22c55e); font-weight:600;">
        <span jettras:id="metricChange">+0%</span> vs mes anterior
    </div>
</div>
