<div class="dashboard-wrapper" style="max-width:1200px; margin:0 auto; display:flex; flex-direction:column; gap:24px;">

    <!-- Barra de navegación rápida -->
    <nav style="display:flex; justify-content:space-between; align-items:center; background:var(--jf-surface, #1e293b); padding:12px 20px; border-radius:10px; border:1px solid var(--jf-border, rgba(255,255,255,0.08));">
        <div style="font-weight:700; color:var(--jf-accent, #38bdf8); font-size:1.1rem;">
            🚀 JettraStudio Navigator
        </div>
        <div style="display:flex; gap:16px; align-items:center;">
            <a href="/" style="color:var(--jf-accent, #38bdf8); text-decoration:none; font-weight:600;">Inicio</a>
            <a jettras:id="linkShowcase" href="/components" style="color:var(--jf-text, #f8fafc); text-decoration:none; font-weight:500;">Componentes</a>
            <a jettras:id="linkCatalog" href="/catalog" style="color:var(--jf-text, #f8fafc); text-decoration:none; font-weight:500;">Catálogo / Inventario</a>
        </div>
    </nav>

    <!-- Header / Banner de Bienvenida -->
    <div style="background:linear-gradient(135deg, rgba(56,189,248,0.15) 0%, rgba(168,85,247,0.15) 100%); border:1px solid var(--jf-border, rgba(56,189,248,0.3)); border-radius:16px; padding:32px; box-shadow:0 12px 32px rgba(0,0,0,0.25);">
        <h1 jettras:id="welcomeTitle" style="font-size:2.4rem; font-weight:900; margin:0 0 10px 0; color:var(--jf-text, #ffffff); letter-spacing:-0.02em;">
            Bienvenido a JettraStudio
        </h1>
        <p jettras:id="welcomeSubtitle" style="font-size:1.15rem; color:var(--jf-text-secondary, #94a3b8); margin:0 0 16px 0;">
            Framework web reactivo para Java 25+
        </p>
        <div style="font-size:0.9rem; color:var(--jf-accent, #38bdf8);">
            ⏱ Servidor Activo: <strong jettras:id="serverTime">--:--:--</strong>
        </div>
    </div>

    <!-- Alerta contextual -->
    <div jettras:id="systemAlert">Mensaje del sistema</div>

    <!-- Cuadrícula de Métricas (Paneles Reutilizables) -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:20px;">
        <div jettras:id="metricUsers"></div>
        <div jettras:id="metricOrders"></div>
        <div jettras:id="metricRevenue"></div>
        <div jettras:id="metricLoom"></div>
    </div>

    <!-- Sección de Información y Enlaces de Acción -->
    <div style="display:grid; grid-template-columns:2fr 1fr; gap:24px;">
        <!-- Tarjeta de Especificaciones -->
        <div jettras:id="techCard" class="jettra-card">
            <p jettras:id="stackDescription" style="color:var(--jf-text-secondary, #94a3b8); line-height:1.6; font-size:1rem;"></p>
        </div>

        <!-- Acciones Rápidas -->
        <div style="background:var(--jf-surface, #1e293b); border:1px solid var(--jf-border, rgba(255,255,255,0.08)); border-radius:12px; padding:24px; display:flex; flex-direction:column; justify-content:center; gap:16px;">
            <h3 style="margin:0; font-size:1.2rem; color:var(--jf-text, #ffffff);">Exploración Rápida</h3>
            <p style="margin:0; font-size:0.9rem; color:var(--jf-text-secondary, #94a3b8);">Prueba los componentes o interactúa con el inventario de datos.</p>
            <a href="/components" style="text-decoration:none;">
                <button jettras:id="btnExplorar" style="width:100%; cursor:pointer;">Ver Componentes</button>
            </a>
            <a href="/catalog" style="text-decoration:none;">
                <button jettras:id="btnInventario" style="width:100%; cursor:pointer;">Ver Inventario</button>
            </a>
        </div>
    </div>

</div>
