<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JettraStore Explorer - Acceso al Clúster</title>
</head>
<body style="min-height:100vh; margin:0; display:flex; align-items:center; justify-content:center; background:#080d1a; color:#f8fafc; font-family:system-ui, -apple-system, sans-serif;">

    <div style="position:fixed; top:16px; right:16px;">
        <jettras:theme-selector/>
    </div>

    <div style="width:100%; max-width:440px; background:#11192d; border:1px solid rgba(56,189,248,0.2); border-radius:16px; padding:40px 32px; box-shadow:0 25px 50px rgba(0,0,0,0.6); box-sizing:border-box;">
        <div style="text-align:center; margin-bottom:28px;">
            <div style="display:inline-flex; align-items:center; justify-content:center; width:68px; height:68px; background:rgba(56,189,248,0.1); border:1px solid #38bdf8; border-radius:18px; font-size:2.2rem; margin-bottom:12px;">
                🛡️
            </div>
            <h1 jettras:id="loginTitle" style="font-size:1.6rem; font-weight:800; margin:0 0 6px 0; color:#fff;">
                JettraStore Explorer
            </h1>
            <p jettras:id="loginSubtitle" style="font-size:0.85rem; color:#94a3b8; margin:0;">
                Administración y Monitoreo del Clúster en Tiempo Real
            </p>
        </div>

        <div jettras:id="loginAlert" style="margin-bottom:18px;"></div>

        <form jettras:id="loginForm" style="display:flex; flex-direction:column; gap:16px;">
            <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:0.85rem; font-weight:600; color:#cbd5e1;">Usuario:</label>
                <input jettras:id="username" type="text" style="padding:12px; border-radius:8px; border:1px solid #334155; background:rgba(0,0,0,0.3); color:#fff; font-size:0.95rem;" />
            </div>

            <div style="display:flex; flex-direction:column; gap:6px;">
                <label style="font-size:0.85rem; font-weight:600; color:#cbd5e1;">Contraseña:</label>
                <input jettras:id="password" type="password" style="padding:12px; border-radius:8px; border:1px solid #334155; background:rgba(0,0,0,0.3); color:#fff; font-size:0.95rem;" />
            </div>

            <div style="margin-top:8px;">
                <button jettras:id="btnLogin" type="submit" style="width:100%; padding:14px; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; background:#38bdf8; color:#0f172a; border:none;">
                    Conectar al Clúster
                </button>
            </div>
        </form>

        <div style="margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.08); text-align:center; font-size:0.8rem; color:#64748b;">
            Credenciales Demo: <strong>admin</strong> / <strong>admin123</strong> &nbsp;|&nbsp; <strong>operator</strong> / <strong>operator123</strong>
        </div>
    </div>

</body>
</html>
